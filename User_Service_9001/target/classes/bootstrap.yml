spring:
  cloud:
    config:
      label: config
      name: User9001
      profile: dev
      discovery:
        enabled: true
        service-id: config-service
    bus:
      enabled: true
      destination: springCloudBus
    stream:
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: "${spring.application.name}"
        springCloudBusOutput:
          destination: springCloudBus
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

eureka:
  instance:
    prefer-ip-address: true
    instance-id: "${spring.cloud.client.ip-address}:${server.port}"
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    service-url:
      defaultZone: http://eurekaService13000:13000/eureka,http://eurekaService13001:13001/eureka,http://eurekaService13002:13002/eureka
