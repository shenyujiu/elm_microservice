server:
  port: 9021

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:mysql://localhost:3306/elm_second?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.eleme.cart,com.eleme.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh

resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 30
        sliding-window-type: TIME_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.lang.Exception