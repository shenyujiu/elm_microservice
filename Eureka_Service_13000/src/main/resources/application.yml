server:
  port: 13000

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: eurekaService13000
  server:
    enable-self-preservation: false
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eurekaService13000:13000/eureka,http://eurekaService13001:13001/eureka,http://eurekaService13002:13002/eureka