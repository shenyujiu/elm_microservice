server:
  port: 8889

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://gitee.com/shenyujiu/elm-config.git
          default-label: config
          username: shenyujiu
          password: 1223311syj
    bus:
      enabled: true
      destination: springCloudBus
    stream:
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: "${spring.application.name}"
        springCloudBusOutput:
          destination: springCloudBus
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

eureka:
  instance:
    prefer-ip-address: true
    instance-id: "${spring.cloud.client.ip-address}:${server.port}"
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    service-url:
      defaultZone: "http://eurekaService13000:13000/eureka,http://eurekaService13001:13001/eureka,http://eurekaService13002:13002/eureka"

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh